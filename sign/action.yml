name: Certum code signing
description: Signs and verifies files with the certificate made available by TIANLI0/codesign (login). Third-party signed files are never re-signed.

inputs:
  files:
    description: Patterns relative to `root`, one per line ('*' within a folder, '**/' across folders). Each must match at least one file.
    required: true
  root:
    description: Folder the patterns are relative to.
    required: false
    default: '.'
  description:
    description: Signature description shown by UAC (signtool /d), usually the product name.
    required: false
    default: ''
  description-url:
    description: URL in the signature (signtool /du).
    required: false
    default: ''
  allow-missing:
    description: 'true = patterns that match nothing are not an error.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Sign
      shell: pwsh
      env:
        CS_FILES: ${{ inputs.files }}
        CS_ROOT: ${{ inputs.root }}
        CS_DESCRIPTION: ${{ inputs.description }}
        CS_URL: ${{ inputs.description-url }}
        CS_ALLOW_MISSING: ${{ inputs.allow-missing }}
      run: |
        & "$env:GITHUB_ACTION_PATH/../scripts/Sign-Files.ps1" -Path $env:CS_FILES -Root $env:CS_ROOT `
          -Description $env:CS_DESCRIPTION -DescriptionUrl $env:CS_URL -AllowMissing:($env:CS_ALLOW_MISSING -eq 'true')
